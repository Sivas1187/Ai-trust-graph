[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atg-graph"
version = "0.1.0"
description = "Reference implementation of AI Trust Graph graph construction: candidate paths from MCP configurations, agent tools and cloud permissions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Siva Sethumadhavan" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://aitrustgraph.org"
Repository = "https://github.com/Sivas1187/Ai-trust-graph"

[project.scripts]
atg-graph = "atg_graph.cli:main"

[tool.setuptools]
packages = ["atg_graph", "atg_graph.collectors"]
