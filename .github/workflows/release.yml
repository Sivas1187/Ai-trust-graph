name: Release

# Publish a GitHub release for a methodology bundle. Manual only: run it from
# the Actions tab (Run workflow) on main. Before creating anything it checks
# that the tag matches the manifest's bundle identifier and that every file
# pinned in METHODOLOGY_MANIFEST.md §4 has exactly its pinned Git blob SHA.
# It then creates the tag on the commit it runs on, with the notes in
# .github/release-notes/<tag>.md (first line "# <title>", then a blank line).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, for example v1.0-rc.4"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the tag, notes and manifest pins
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-rc\.[0-9]+)?$ ]] || { echo "::error::Invalid tag: $TAG"; exit 1; }
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "::error::Missing $notes"; exit 1; }
          head -n 1 "$notes" | grep -q '^# ' || { echo "::error::$notes must start with '# <title>'"; exit 1; }
          bundle="$(sed -n 's/^\*\*Bundle identifier:\*\* *\([^ ]*\).*/\1/p' METHODOLOGY_MANIFEST.md | head -n 1)"
          [ "$TAG" = "v$bundle" ] || { echo "::error::Tag $TAG does not match bundle identifier $bundle"; exit 1; }
          checked=0
          while IFS='|' read -r path sha; do
            actual="$(git hash-object "$path")"
            [ "$actual" = "$sha" ] || { echo "::error::$path is $actual, manifest pins $sha"; exit 1; }
            checked=$((checked + 1))
          done < <(grep -oE '`docs/[^`]+\.md` \| `[0-9a-f]{40}`' METHODOLOGY_MANIFEST.md | sed -E 's/`([^`]+)` \| `([0-9a-f]{40})`/\1|\2/')
          [ "$checked" -eq 13 ] || { echo "::error::Expected 13 pinned artifacts, checked $checked"; exit 1; }
          echo "All $checked pinned artifacts match the manifest for bundle $bundle."
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/$TAG.md"
          title="$(head -n 1 "$notes" | sed 's/^# //')"
          tail -n +3 "$notes" > "$RUNNER_TEMP/notes.md"
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
